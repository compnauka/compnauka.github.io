<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЕЛІЗА переїхала | Комп'ютерна наука</title>

  <!-- Сторінка переїхала до services/ai/eliza/.
       GitHub Pages не вміє серверних редиректів (301), тому робимо це
       трьома способами одразу:
       1) rel="canonical" — каже пошуковим системам, яка адреса головна;
       2) <meta http-equiv="refresh"> — переносить звичайного відвідувача;
       3) location.replace() — переносить одразу і не засмічує історію браузера,
          щоб кнопка «Назад» не поверталася на цю ж сторінку по колу.

       Файл треба зберегти: на стару адресу ведуть закладки учнів,
       посилання з розсилок і результати пошуку. Видалиш — буде 404. -->
  <link rel="canonical" href="https://itnauka.org/services/ai/eliza/" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=../services/ai/eliza/" />

  <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="../favicon.ico" />

  <style>
    body {
      background: #0a1a0a;
      color: #33ff33;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      margin: 0;
      padding: 20px;
      text-align: center;
      line-height: 1.7;
    }

    a {
      color: #33ff33;
    }
  </style>

  <script>
    location.replace('../services/ai/eliza/');
  </script>
</head>

<body>
  <main>
    <p>ЕЛІЗА переїхала на нову адресу.</p>
    <p><a href="../services/ai/eliza/">Перейти до Елізи →</a></p>
  </main>
</body>

</html>

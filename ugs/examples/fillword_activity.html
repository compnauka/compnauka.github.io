<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДИТЯЧИЙ ФІЛВОРД: ОСІНЬ 🍁</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts for child-friendly rounded font -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Comfortaa', 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #ffedd5 50%, #fed7aa 100%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(180, 83, 9, 0.15), 0 2px 4px -1px rgba(180, 83, 9, 0.1);
        }

        .grid-cell:hover:not(.cell-found) {
            transform: translateY(-2px) scale(1.04);
            cursor: pointer;
        }

        /* State colors */
        .cell-selected {
            background-color: #f59e0b !important; /* Amber yellow */
            color: #ffffff !important;
            transform: scale(1.06);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        }

        .cell-found {
            background-color: #10b981 !important; /* Emerald Green */
            color: #ffffff !important;
            font-weight: 800;
            animation: popIn 0.3s ease;
        }

        .cell-wrong {
            background-color: #ef4444 !important; /* Red */
            color: #ffffff !important;
            animation: shake 0.4s ease;
        }

        .cell-hint {
            background-color: #facc15 !important; /* Bright Hint Yellow */
            color: #78350f !important;
            animation: hintPulse 1.2s infinite alternate;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px) rotate(-2deg); }
            40% { transform: translateX(6px) rotate(2deg); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes hintPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(250, 204, 21, 0.4); }
            100% { transform: scale(1.1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.9); }
        }

        .word-item {
            transition: all 0.3s ease;
        }

        .word-item.found {
            text-decoration: line-through;
            opacity: 0.55;
            background-color: #d1fae5;
            color: #065f46;
            transform: scale(0.96);
        }

        /* Floating background autumn leaves decorative elements */
        .leaf {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            animation: float 12s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 text-amber-950 relative overflow-x-hidden">

    <div class="leaf text-6xl top-10 left-5">🍁</div>
    <div class="leaf text-6xl top-1/3 right-8" style="animation-delay: -3s;">🍂</div>
    <div class="leaf text-6xl bottom-20 left-12" style="animation-delay: -6s;">🌰</div>
    <div class="leaf text-6xl bottom-10 right-10" style="animation-delay: -9s;">🍁</div>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-5xl bg-amber-50/90 backdrop-blur-md border-4 border-amber-300 rounded-3xl p-4 sm:p-8 shadow-2xl relative z-10 my-auto flex flex-col items-center">
        
        <header class="text-center mb-4 sm:mb-6 w-full">
            <h1 class="text-2xl sm:text-4xl font-extrabold text-amber-900 tracking-wide flex items-center justify-center gap-2">
                <span>🍁</span> ФІЛВОРД: ОСІНЬ 🍂
            </h1>
            <p class="text-xs sm:text-base text-amber-700 font-medium mt-1"> Знайди 10 захованих осінніх слів! </p>
        </header>

        <!-- TOP CONTROLS & SCORE BAR -->
        <div class="w-full flex flex-wrap items-center justify-between gap-3 mb-4 bg-amber-100/80 p-3 rounded-2xl border-2 border-amber-200">
            <!-- Progress Counter -->
            <div class="flex items-center gap-2 text-amber-900 font-bold text-sm sm:text-lg">
                <span class="bg-amber-500 text-white px-3 py-1 rounded-xl shadow-inner" id="found-count">0/10</span>
                <span>Знайдено слів</span>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button id="hint-btn" onclick="useHint()" class="flex items-center gap-1.5 bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-bold px-3 sm:px-4 py-2 rounded-xl shadow-md active:scale-95 transition text-xs sm:text-sm">
                    <span class="text-base sm:text-lg">💡</span> Підказка
                </button>
                <button onclick="startNewGame()" class="flex items-center gap-1.5 bg-orange-500 hover:bg-orange-600 text-white font-bold px-3 sm:px-4 py-2 rounded-xl shadow-md active:scale-95 transition text-xs sm:text-sm">
                    <span class="text-base sm:text-lg">🔄</span> Перезапустити
                </button>
            </div>
        </div>

        <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- WORD GRID (LEFT / CENTER) -->
            <div class="lg:col-span-7 flex justify-center w-full">
                <div id="grid-container" class="grid grid-cols-10 gap-1 sm:gap-2 p-2 sm:p-3 bg-amber-200/70 border-3 border-amber-400 rounded-2xl shadow-inner w-full max-w-[460px]">
                    <!-- Generated grid cells go here dynamically -->
                </div>
            </div>

            <!-- TARGET WORDS LIST (RIGHT / BOTTOM) -->
            <div class="lg:col-span-5 w-full bg-white/80 p-4 rounded-2xl border-2 border-amber-200 shadow-sm">
                <h2 class="text-base sm:text-lg font-bold text-amber-900 mb-3 flex items-center gap-2 border-b-2 border-amber-100 pb-2">
                    🔍 Список слів для пошуку:
                </h2>
                <div id="word-list" class="grid grid-cols-2 sm:grid-cols-2 gap-2 text-xs sm:text-sm font-bold">
                    <!-- Word cards go here -->
                </div>
            </div>
        </div>
    </main>

    <!-- WIN CONGRATULATION MODAL -->
    <div id="win-modal" class="fixed inset-0 bg-amber-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl border-4 border-amber-400 transform scale-90 transition-transform duration-300">
            <div class="text-6xl sm:text-7xl mb-3 animate-bounce">🎉🍁🏆</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-900 mb-2">МОЛОДЕЦЬ!</h2>
            <p class="text-amber-700 text-base sm:text-lg mb-6 font-medium">
                Ти супер-дослідник! Всі 10 осінніх слів успішно знайдені!
            </p>
            <button onclick="startNewGame(); closeModal();" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-lg active:scale-95 transition text-base sm:text-lg">
                🎮 Зіграти знову
            </button>
        </div>
    </div>

    <script>
        // Target Autumn words list (Strictly 10 Ukrainian words)
        const AUTUMN_WORDS = [
            "ЛИСТОПАД",
            "ДОЩ",
            "ГРИБ",
            "УРОЖАЙ",
            "ТУМАН",
            "ВІТЕР",
            "ХМАРА",
            "ЖОЛУДЬ",
            "КАШТАН",
            "ХОЛОД"
        ];

        const UKRAINIAN_ALPHABET = "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ";
        const GRID_SIZE = 10; // 10x10 Grid

        // Game State Variables
        let grid = []; // 2D grid array [row][col] = { char, wordIndex, cellId }
        let placedWords = []; // Array of objects { word, coords: [{r, c}] }
        let selectedCells = []; // Array of {r, c, element}
        let foundWords = new Set();
        let activeHint = null;

        // Sound System (Web Audio API - No external audio links needed)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400 + (selectedCells.length * 60), now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.15);
                    osc.frequency.setValueAtTime(783.99, now + 0.3);
                    osc.frequency.setValueAtTime(1046.50, now + 0.45);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                    osc.start(now);
                    osc.stop(now + 0.7);
                }
            } catch (e) {
                // Audio fallback if muted/blocked
            }
        }

        // Initialize or restart the game
        function startNewGame() {
            foundWords.clear();
            selectedCells = [];
            activeHint = null;
            updateScore();
            renderWordList();
            generateGridWithWords();
            renderGrid();
        }

        // Grid Generation with strictly Left-to-Right and Top-to-Bottom word placements
        function generateGridWithWords() {
            let success = false;
            let attempts = 0;

            while (!success && attempts < 100) {
                attempts++;
                grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
                placedWords = [];
                success = true;

                // Sort words by length descending to place larger words first
                const wordsToPlace = [...AUTUMN_WORDS].sort((a, b) => b.length - a.length);

                for (let word of wordsToPlace) {
                    let placed = false;
                    let wordAttempts = 0;

                    while (!placed && wordAttempts < 200) {
                        wordAttempts++;
                        // Orientation: 0 = Horizontal (L -> R), 1 = Vertical (T -> B)
                        const dir = Math.floor(Math.random() * 2);
                        const row = Math.floor(Math.random() * (dir === 1 ? (GRID_SIZE - word.length + 1) : GRID_SIZE));
                        const col = Math.floor(Math.random() * (dir === 0 ? (GRID_SIZE - word.length + 1) : GRID_SIZE));

                        if (canPlaceWord(word, row, col, dir)) {
                            const coords = [];
                            for (let i = 0; i < word.length; i++) {
                                const r = dir === 1 ? row + i : row;
                                const c = dir === 0 ? col + i : col;
                                grid[r][c] = word[i];
                                coords.push({ r, c });
                            }
                            placedWords.push({ word, coords });
                            placed = true;
                        }
                    }

                    if (!placed) {
                        success = false;
                        break;
                    }
                }
            }

            // Fill all empty cells with random Ukrainian alphabet letters
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (!grid[r][c]) {
                        const randomChar = UKRAINIAN_ALPHABET[Math.floor(Math.random() * UKRAINIAN_ALPHABET.length)];
                        grid[r][c] = randomChar;
                    }
                }
            }
        }

        // Check if word can be placed at (r, c) without conflict
        function canPlaceWord(word, row, col, dir) {
            for (let i = 0; i < word.length; i++) {
                const r = dir === 1 ? row + i : row;
                const c = dir === 0 ? col + i : col;
                if (grid[r][c] !== null && grid[r][c] !== word[i]) {
                    return false;
                }
            }
            return true;
        }

        function renderGrid() {
            const container = document.getElementById("grid-container");
            container.innerHTML = "";

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cellBtn = document.createElement("button");
                    cellBtn.className = "grid-cell bg-white text-amber-950 font-bold text-base sm:text-xl rounded-xl border border-amber-200 flex items-center justify-center select-none cursor-pointer";
                    cellBtn.innerText = grid[r][c];
                    cellBtn.dataset.row = r;
                    cellBtn.dataset.col = c;

                    // Click / Touch listener
                    cellBtn.addEventListener("click", () => handleCellClick(r, c, cellBtn));

                    container.appendChild(cellBtn);
                }
            }
        }

        function renderWordList() {
            const listContainer = document.getElementById("word-list");
            listContainer.innerHTML = "";

            AUTUMN_WORDS.forEach(word => {
                const item = document.createElement("div");
                item.className = `word-item bg-amber-100/70 border border-amber-300 text-amber-900 rounded-xl px-3 py-2 text-center font-bold shadow-sm ${foundWords.has(word) ? 'found' : ''}`;
                item.id = `word-item-${word}`;
                item.innerText = word;
                listContainer.appendChild(item);
            });
        }

        function handleCellClick(r, c, element) {
            // If cell is already part of a found word, ignore
            if (element.classList.contains("cell-found")) return;

            // Clear active hint style if present on click
            if (element.classList.contains("cell-hint")) {
                element.classList.remove("cell-hint");
            }

            // Check if cell is already selected
            const index = selectedCells.findIndex(cell => cell.r === r && cell.c === c);

            if (index !== -1) {
                // Deselect cell and any subsequent cells
                for (let i = selectedCells.length - 1; i >= index; i--) {
                    selectedCells[i].element.classList.remove("cell-selected");
                    selectedCells.pop();
                }
                playSound('select');
                return;
            }

            // Validate that the new cell forms a continuous horizontal or vertical line with previous selection
            if (selectedCells.length > 0) {
                const first = selectedCells[0];
                const prev = selectedCells[selectedCells.length - 1];

                // Determine required direction
                const isHorizontal = first.r === r;
                const isVertical = first.c === c;

                if (!isHorizontal && !isVertical) {
                    // Invalid step (diagonal or unaligned) - reset selection
                    resetSelectionWithWrongAnimation();
                    return;
                }

                // Check adjacency (must be next cell in direction L->R or T->B)
                const isNextHorizontal = isHorizontal && (c === prev.c + 1);
                const isNextVertical = isVertical && (r === prev.r + 1);

                if (!isNextHorizontal && !isNextVertical) {
                    // Jumped or went backwards - start new selection with clicked cell
                    clearCurrentSelectionHighlight();
                    selectedCells = [];
                }
            }

            // Add cell to selection
            selectedCells.push({ r, c, element });
            element.classList.add("cell-selected");
            playSound('select');

            // Evaluate current selection against remaining target words
            checkSelectedWord();
        }

        function checkSelectedWord() {
            const currentSelectedString = selectedCells.map(cell => grid[cell.r][cell.c]).join("");

            // Check if matches any unfound word
            const matchedWordObj = placedWords.find(pw => 
                !foundWords.has(pw.word) && 
                pw.word === currentSelectedString && 
                isExactCoordMatch(pw.coords, selectedCells)
            );

            if (matchedWordObj) {
                // Correct Word Found!
                playSound('success');
                foundWords.add(matchedWordObj.word);

                selectedCells.forEach(cell => {
                    cell.element.classList.remove("cell-selected", "cell-hint");
                    cell.element.classList.add("cell-found");
                });

                selectedCells = [];
                updateScore();

                // Update Word List UI
                const wordElement = document.getElementById(`word-item-${matchedWordObj.word}`);
                if (wordElement) {
                    wordElement.classList.add("found");
                }

                // Check for Game Completion
                if (foundWords.size === AUTUMN_WORDS.length) {
                    setTimeout(triggerWin, 400);
                }
            }
        }

        function isExactCoordMatch(coords, selections) {
            if (coords.length !== selections.length) return false;
            for (let i = 0; i < coords.length; i++) {
                if (coords[i].r !== selections[i].r || coords[i].c !== selections[i].c) {
                    return false;
                }
            }
            return true;
        }

        function resetSelectionWithWrongAnimation() {
            playSound('error');
            const tempCells = [...selectedCells];
            selectedCells = [];

            tempCells.forEach(cell => {
                cell.element.classList.remove("cell-selected");
                cell.element.classList.add("cell-wrong");
            });

            setTimeout(() => {
                tempCells.forEach(cell => {
                    cell.element.classList.remove("cell-wrong");
                });
            }, 450);
        }

        function clearCurrentSelectionHighlight() {
            selectedCells.forEach(cell => {
                cell.element.classList.remove("cell-selected");
            });
        }

        // Hint logic: highlights the first letter of an unfound word in yellow
        function useHint() {
            const unfound = placedWords.filter(pw => !foundWords.has(pw.word));
            if (unfound.length === 0) return;

            // Pick a random unfound word
            const target = unfound[Math.floor(Math.random() * unfound.length)];
            const firstCoord = target.coords[0];

            // Find cell element in grid DOM
            const cellElem = document.querySelector(`.grid-cell[data-row="${firstCoord.r}"][data-col="${firstCoord.c}"]`);

            if (cellElem && !cellElem.classList.contains("cell-found")) {
                cellElem.classList.add("cell-hint");
                playSound('select');

                // Scroll/Focus visually if needed
                cellElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function updateScore() {
            document.getElementById("found-count").innerText = `${foundWords.size}/${AUTUMN_WORDS.length}`;
        }

        function triggerWin() {
            playSound('win');

            // Launch Festive Confetti
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#f59e0b', '#ef4444', '#10b981', '#facc15']
                });

                // Secondary blast after short delay
                setTimeout(() => {
                    confetti({
                        particleCount: 80,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 }
                    });
                    confetti({
                        particleCount: 80,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 }
                    });
                }, 300);
            }

            // Show Win Modal
            document.getElementById("win-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("win-modal").classList.add("hidden");
        }

        // Start game on load
        window.onload = () => {
            startNewGame();
        };
    </script>
</body>
</html>

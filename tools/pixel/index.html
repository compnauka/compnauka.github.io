<body>

    <main class="main-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h1 class="app-title">
                <i class="fa-solid fa-palette"></i> Піксель
            </h1>

            <div class="colors-section">
                <div class="section-title"><i class="fa-solid fa-circle-dot"></i> Кольори</div>
                <div class="color-picker">
                    <div class="color-option selected" style="background:#000000" data-color="#000000" title="Чорний"
                        role="button" tabindex="0" aria-label="Чорний"></div>
                    <div class="color-option" style="background:#ffffff;border-color:#bbb" data-color="#ffffff"
                        title="Білий" role="button" tabindex="0" aria-label="Білий"></div>
                    <div class="color-option" style="background:#FF3B3B" data-color="#FF3B3B" title="Червоний"
                        role="button" tabindex="0" aria-label="Червоний"></div>
                    <div class="color-option" style="background:#FF8C00" data-color="#FF8C00" title="Помаранчевий"
                        role="button" tabindex="0" aria-label="Помаранчевий"></div>
                    <div class="color-option" style="background:#FFD600" data-color="#FFD600" title="Жовтий"
                        role="button" tabindex="0" aria-label="Жовтий"></div>
                    <div class="color-option" style="background:#22C35E" data-color="#22C35E" title="Зелений"
                        role="button" tabindex="0" aria-label="Зелений"></div>
                    <div class="color-option" style="background:#2979FF" data-color="#2979FF" title="Синій"
                        role="button" tabindex="0" aria-label="Синій"></div>
                    <div class="color-option" style="background:#00C8DD" data-color="#00C8DD" title="Блакитний"
                        role="button" tabindex="0" aria-label="Блакитний"></div>
                    <div class="color-option" style="background:#7B2FBE" data-color="#7B2FBE" title="Фіолетовий"
                        role="button" tabindex="0" aria-label="Фіолетовий"></div>
                    <div class="color-option" style="background:#FF4DA6" data-color="#FF4DA6" title="Рожевий"
                        role="button" tabindex="0" aria-label="Рожевий"></div>
                    <div class="color-option" style="background:#8B4513" data-color="#8B4513" title="Коричневий"
                        role="button" tabindex="0" aria-label="Коричневий"></div>
                    <div class="color-option" style="background:#9E9E9E" data-color="#9E9E9E" title="Сірий"
                        role="button" tabindex="0" aria-label="Сірий"></div>
                    <div class="color-option" style="background:#90EE5A" data-color="#90EE5A" title="Салатовий"
                        role="button" tabindex="0" aria-label="Салатовий"></div>
                    <div class="color-option" style="background:#87CEEB" data-color="#87CEEB" title="Небесний"
                        role="button" tabindex="0" aria-label="Небесний"></div>
                    <div class="color-option" style="background:#FDBCB4" data-color="#FDBCB4" title="Персиковий"
                        role="button" tabindex="0" aria-label="Персиковий"></div>
                </div>
            </div>

            <div class="tools-section">
                <div class="section-title"><i class="fa-solid fa-toolbox"></i> Інструменти</div>
                <div class="tool-buttons">
                    <div class="tool-button active" data-tool="pencil" role="button" tabindex="0" aria-label="Олівець">
                        <span class="tool-icon"><i class="fa-solid fa-pencil"></i></span>
                        <span class="tool-label">Олівець</span>
                    </div>
                    <div class="tool-button" data-tool="eraser" role="button" tabindex="0" aria-label="Гумка">
                        <span class="tool-icon"><i class="fa-solid fa-eraser"></i></span>
                        <span class="tool-label">Гумка</span>
                    </div>
                    <div class="tool-button" data-tool="fill" role="button" tabindex="0" aria-label="Заливка">
                        <span class="tool-icon"><i class="fa-solid fa-fill-drip"></i></span>
                        <span class="tool-label">Заливка</span>
                    </div>
                </div>
            </div>

            <div class="sizes-section">
                <div class="section-title"><i class="fa-solid fa-expand"></i> Розмір</div>
                <div class="canvas-size-selector">
                    <div class="size-option" data-size="8" role="button" tabindex="0" aria-label="Малий">Малий</div>
                    <div class="size-option selected" data-size="16" role="button" tabindex="0" aria-label="Середній">
                        Середній</div>
                    <div class="size-option" data-size="32" role="button" tabindex="0" aria-label="Великий">Великий
                    </div>
                </div>
            </div>

            <div class="spacer"></div>

            <div>
                <button class="action-button btn-clear" id="clear-btn" style="margin-bottom: 12px;">
                    <i class="fa-solid fa-trash-can"></i> Очистити
                </button>
                <button class="action-button btn-save" id="save-btn">
                    <i class="fa-solid fa-download"></i> Зберегти
                </button>
            </div>

        </aside>

        <!-- CANVAS -->
        <div class="canvas-wrapper">
            <div class="canvas-container">
                <div id="pixel-canvas"></div>
            </div>
        </div>

    </main>

    <footer class="footer">Піксель — малюємо разом! Для дітей від 4 років 🌈</footer>

    <div class="success-message" id="success-message">
        <i class="fa-solid fa-check"></i> Малюнок збережено!
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-window">
            <div id="modal-message" class="modal-message"></div>
            <div class="modal-actions">
                <button id="modal-ok" class="modal-btn modal-ok">OK</button>
                <button id="modal-cancel" class="modal-btn modal-cancel">Ні</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

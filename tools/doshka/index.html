<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <title>Онлайн-дошка — Малювання та нотатки в браузері</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Онлайн-дошка — Малювання та нотатки в браузері" />
    <meta name="description"
        content="Безкоштовна онлайн-дошка для малювання, створення нотаток та експорту в SVG/PNG. Вбудований QR-генератор та таймер. Працює прямо в браузері!" />
    <meta name="keywords"
        content="онлайн дошка, онлайн малювання, віртуальна дошка, whiteboard online, малювати безкоштовно, qr генератор, таймер для презентацій" />
    <meta name="author" content="Пан Артем" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://itnauka.org/tools/doshka/" />
    <meta property="og:title" content="Онлайн-дошка — Малювання та нотатки в браузері" />
    <meta property="og:description"
        content="Зручний інструмент для швидких малюнків та QR-кодів. Спробуйте прямо зараз!" />
    <meta property="og:image" content="https://itnauka.org/images/47.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://itnauka.org/tools/doshka/" />
    <meta property="twitter:title" content="Онлайн-дошка — Малювання та нотатки в браузері" />
    <meta property="twitter:description"
        content="Зручний інструмент для швидких малюнків та QR-кодів. Спробуйте прямо зараз!" />
    <meta property="twitter:image" content="https://itnauka.org/images/47.webp" />

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Онлайн-дошка",
      "description": "Безкоштовний веб-додаток для малювання на віртуальній дошці з можливістю експорту.",
      "applicationCategory": "DesignApplication, EducationalApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <meta name="theme-color" content="#111827" />
    <link rel="stylesheet" href="style.css">

</head>

<body class="h-screen w-screen overflow-hidden">
    <h1 class="sr-only">Онлайн-дошка для малювання</h1>
    <div id="app" class="relative w-full h-full">

        <canvas id="whiteboard" class="block w-full h-full cursor-crosshair select-none touch-none"
            aria-label="Полотно для малювання"></canvas>

        <div id="timer-overlay"
            class="hidden absolute top-6 right-6 z-30 bg-gray-900/95 text-white text-3xl md:text-4xl font-mono px-8 py-4 rounded-2xl shadow-[8px_8px_0_rgba(0,0,0,0.3)] border-2 border-gray-700 tabular-nums tracking-wider pointer-events-none select-none">
            <span id="timer-display">00:00</span>
        </div>

        <div
            class="absolute bottom-4 md:bottom-6 left-1/2 -translate-x-1/2 z-40 neo-toolbar rounded-2xl p-2 md:p-4 flex items-center gap-2 md:gap-3 w-[95%] md:w-auto overflow-x-auto hide-scrollbar">

            <button id="btn-pen" class="tool-btn" data-tool="pen" aria-pressed="true" title="Перо">
                <i class="fa-solid fa-pen"></i>
            </button>
            <button id="btn-eraser" class="tool-btn" data-tool="eraser" aria-pressed="false" title="Гумка">
                <i class="fa-solid fa-eraser"></i>
            </button>

            <div class="hidden md:block w-1 h-10 bg-gray-500 rounded-full border-2 border-gray-700 flex-shrink-0"></div>

            <div class="flex items-center gap-2 md:gap-3 flex-shrink-0">
                <div class="relative group w-10 h-10 md:w-12 md:h-12 flex-shrink-0">
                    <input id="color-picker" type="color" value="#000000"
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="w-full h-full rounded-full border-4 border-gray-700 shadow-[4px_4px_0_#a5b4cb]"
                        style="background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red)"></div>
                </div>
                <div class="flex items-center gap-1.5 md:gap-2">
                    <button class="color-btn bg-black" data-color="#000000" aria-current="true"></button>
                    <button class="color-btn bg-red-500" data-color="#ef4444"></button>
                    <button class="color-btn bg-blue-500" data-color="#3b82f6"></button>
                </div>
            </div>

            <div
                class="flex items-center gap-2 md:gap-3 bg-gray-100/80 p-1.5 md:p-2 rounded-2xl border-2 border-gray-700 flex-shrink-0">
                <i class="fa-solid fa-circle text-[8px] md:text-[10px] text-gray-500"></i>
                <input id="size-range" type="range" min="2" max="40" value="4"
                    class="w-20 md:w-32 cursor-pointer flex-shrink-0">
                <i class="fa-solid fa-circle text-xl md:text-2xl text-gray-500"></i>
            </div>

            <div class="hidden md:block w-1 h-10 bg-gray-500 rounded-full border-2 border-gray-700 flex-shrink-0"></div>

            <button id="btn-undo" class="tool-btn disabled:opacity-30 disabled:shadow-none disabled:border-gray-300"
                disabled title="Скасувати">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="btn-redo" class="tool-btn disabled:opacity-30 disabled:shadow-none disabled:border-gray-300"
                disabled title="Повторити">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button id="btn-clear" class="tool-btn text-red-600 border-red-300 hover:bg-red-50" title="Очистити">
                <i class="fa-solid fa-trash-can"></i>
            </button>

            <div class="hidden md:block w-1 h-10 bg-gray-500 rounded-full border-2 border-gray-700 flex-shrink-0"></div>

            <button id="btn-svg" class="tool-btn text-orange-600" title="Експорт SVG">
                <i class="fa-solid fa-file-code"></i>
            </button>
            <button id="btn-save" class="tool-btn text-green-700" title="Завантажити PNG">
                <i class="fa-solid fa-download"></i>
            </button>
            <button id="btn-qr" class="tool-btn text-purple-700" title="QR код">
                <i class="fa-solid fa-qrcode"></i>
            </button>
            <button id="btn-timer" class="tool-btn text-yellow-600" title="Таймер">
                <i class="fa-solid fa-stopwatch"></i>
            </button>
        </div>

        <div id="dlg-clear"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm modal-backdrop">
            <div class="modal-card p-6 md:p-8 w-96 max-w-[90%] mx-4">
                <h3 class="text-xl md:text-2xl font-extrabold mb-3 text-gray-900">Очистити дошку?</h3>
                <p class="text-gray-600 text-sm md:text-base mb-8">Всі малюнки буде видалено безповоротно.</p>
                <div class="flex justify-end gap-3 md:gap-4">
                    <button data-close class="modal-btn bg-white text-gray-800 text-sm md:text-base">Скасувати</button>
                    <button id="confirm-clear"
                        class="modal-btn modal-btn-primary bg-red-600 text-sm md:text-base">Очистити</button>
                </div>
            </div>
        </div>

        <div id="dlg-qr"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm modal-backdrop">
            <div class="modal-card p-6 md:p-8 w-full max-w-[90%] md:max-w-xl mx-4">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-extrabold text-xl md:text-2xl text-gray-900">QR генератор</h3>
                    <button data-close
                        class="text-gray-500 hover:text-gray-900 text-4xl leading-8 transition-colors">&times;</button>
                </div>
                <input id="qr-input" type="text" placeholder="URL або текст"
                    class="w-full border-4 border-gray-700 p-3 md:p-4 text-base md:text-lg rounded-2xl mb-6 focus:ring-4 focus:ring-blue-300 outline-none shadow-[4px_4px_0_#a5b4cb]">

                <div id="qr-output"
                    class="flex justify-center bg-gray-100 p-6 md:p-8 rounded-3xl min-h-[220px] md:min-h-[260px] items-center border-4 border-dashed border-gray-500 transition-colors w-full overflow-hidden"
                    title="Натисніть для збільшення">
                    <span class="text-gray-500 text-sm md:text-base text-center">QR код з'явиться тут</span>
                </div>

                <button id="qr-gen-btn"
                    class="modal-btn modal-btn-primary w-full mt-6 text-base md:text-lg py-3 md:py-4">Згенерувати</button>
            </div>
        </div>

        <div id="dlg-qr-zoom"
            class="hidden fixed inset-0 z-[60] bg-gray-900/90 flex flex-col items-center justify-center p-4">
            <div id="qr-zoom-content"
                class="bg-white p-4 rounded-3xl w-full max-w-2xl aspect-square flex items-center justify-center">
            </div>
            <button
                class="mt-8 text-gray-900 font-bold text-lg md:text-xl bg-white px-8 py-4 rounded-full border-4 border-gray-900 shadow-[6px_6px_0_#a5b4cb] active:translate-y-1 active:shadow-[2px_2px_0_#a5b4cb] transition-all"
                onclick="document.getElementById('dlg-qr-zoom').classList.add('hidden')">
                Закрити
            </button>
        </div>

        <div id="dlg-timer"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm modal-backdrop">
            <div class="modal-card p-6 md:p-8 w-96 max-w-[90%] mx-4">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-extrabold text-xl md:text-2xl text-gray-900">Таймер</h3>
                    <button data-close
                        class="text-gray-500 hover:text-gray-900 text-4xl leading-8 transition-colors">&times;</button>
                </div>
                <div class="flex justify-center gap-3 items-center mb-8">
                    <input id="tm-min" type="number" min="0" max="99" value="5"
                        class="w-24 md:w-28 text-center text-4xl md:text-5xl font-mono border-4 border-gray-700 rounded-2xl p-2 md:p-3 focus:ring-4 focus:ring-blue-300 outline-none shadow-[4px_4px_0_#a5b4cb]">
                    <span class="text-3xl md:text-4xl font-black text-gray-500">:</span>
                    <input id="tm-sec" type="number" min="0" max="59" value="0"
                        class="w-24 md:w-28 text-center text-4xl md:text-5xl font-mono border-4 border-gray-700 rounded-2xl p-2 md:p-3 focus:ring-4 focus:ring-blue-300 outline-none shadow-[4px_4px_0_#a5b4cb]">
                </div>
                <div class="grid grid-cols-2 gap-3 md:gap-4">
                    <button id="tm-action-btn"
                        class="modal-btn modal-btn-primary col-span-2 text-lg md:text-xl py-3 md:py-4">Старт</button>
                    <button id="tm-reset-btn"
                        class="modal-btn bg-gray-100 text-gray-800 border-gray-700 font-bold col-span-2 text-lg md:text-xl py-3 md:py-4">Скинути</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

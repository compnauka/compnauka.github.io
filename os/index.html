<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Віконце — навчальна операційна система для початкової школи | Комп'ютерна наука</title>
  <meta name="description" content="Віконце — віртуальна операційна система для учнів 1–4 класів. Вчимося працювати з вікнами, файлами, папками й кошиком на комп'ютері, планшеті чи телефоні. Із завданнями та підказками.">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://os.itnauka.org/">
  <meta property="og:title" content="Віконце — навчальна ОС для початкової школи">
  <meta property="og:description" content="Вчимося працювати з комп'ютером просто в браузері: вікна, файли, папки, кошик, завдання з підказками.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/os.css">
  <link rel="stylesheet" href="css/files.css">
  <link rel="stylesheet" href="css/browser.css">
  <link rel="stylesheet" href="css/lessons.css">
</head>
<body>
  <!-- Завантаження -->
  <div id="boot" class="screen boot" role="status" aria-label="Завантаження">
    <div class="boot-logo" data-ico="logo"></div>
    <div class="boot-name">Віконце</div>
    <div class="boot-bar"><span></span></div>
    <div class="boot-tip">Торкнись, щоб пропустити</div>
  </div>

  <!-- Вхід -->
  <div id="login" class="screen login" hidden>
    <div class="login-time"><div class="login-clock"></div><div class="login-date"></div></div>
    <div class="login-box"></div>
    <div class="login-secondary"></div>
    <a class="login-site" href="https://itnauka.org/">← на itnauka.org</a>
  </div>

  <!-- Вимкнено -->
  <div id="off" class="screen off" hidden>
    <div class="off-praise" hidden><span data-ico="star"></span> Молодець! Ти правильно вимкнув комп'ютер.</div>
    <p>Комп'ютер вимкнено.</p>
    <button class="power-on" type="button" aria-label="Увімкнути" data-ico="power"></button>
    <small>Натисни, щоб увімкнути</small>
  </div>

  <!-- Робочий стіл -->
  <main id="desktop" aria-label="Робочий стіл">
    <div id="desk-icons" class="desk-icons items-bg" aria-label="Значки робочого столу"></div>
    <div id="windows"></div>
  </main>

  <aside id="helper" class="helper" hidden aria-live="polite" aria-label="Помічник"></aside>

  <nav id="taskbar" aria-label="Панель задач">
    <button id="start-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="start-menu" title="Меню програм (Ctrl+Esc)">
      <span class="start-logo" data-ico="logo"></span><span class="start-label">Меню</span>
    </button>
    <div id="task-list" class="task-list"></div>
    <div class="tray">
      <button id="pocket-btn" type="button" aria-haspopup="dialog" aria-expanded="false" title="Кишеня: тут лежить те, що ти скопіював" aria-label="Кишеня (буфер обміну)"><span class="pocket-box"><span class="pocket-ico" data-ico="pocket"></span><span class="pocket-slot"></span><span class="pocket-op" hidden></span></span></button>
      <button id="helper-btn" type="button" title="Помічник і завдання" aria-label="Помічник і завдання"><span class="helper-owl" data-ico="owl"></span><span class="helper-count"></span></button>
      <button id="clock" type="button" aria-label="Годинник і календар"><span class="clock-time"></span><span class="clock-date"></span></button>
      <button id="show-desktop" type="button" title="Згорнути все" aria-label="Згорнути все вікна" data-ico="chevron-down"></button>
    </div>
  </nav>
  <div id="start-menu" class="start-menu" role="menu" aria-label="Меню програм"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:2rem;font:18px sans-serif">Для роботи «Віконця» потрібно увімкнути JavaScript.</p></noscript>

  <script src="js/core/util.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/db.js"></script>
  <script src="js/core/vfs.js"></script>
  <script src="js/core/apps.js"></script>
  <script src="js/core/bridge.js"></script>
  <script src="js/core/wm.js"></script>
  <script src="js/core/explain.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/dialogs.js"></script>
  <script src="js/core/transfer.js"></script>
  <script src="js/core/shell.js"></script>
  <script src="js/apps/explorer.js"></script>
  <script src="js/apps/notepad.js"></script>
  <script src="js/apps/paint.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/photos.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/help.js"></script>
  <script src="js/apps/browser.js"></script>
  <script src="js/apps/external.js"></script>
  <script src="js/data/missions.js"></script>
  <script src="js/core/missions.js"></script>
  <script src="js/core/lessons.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

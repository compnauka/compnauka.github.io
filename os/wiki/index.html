<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Вікі Енциклопедія — прості статті про комп’ютер, файли та програми.">
  <title>Вікі Енциклопедія</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="wiki.css">
  <script defer src="../js/core/i18n.js"></script>
  <script defer src="../js/core/util.js"></script>
  <script defer src="../js/core/icons.js"></script>
  <script defer src="../js/core/explain.js"></script>
  <script defer src="articles.js"></script>
  <script defer src="wiki.js"></script>
</head>
<body>
  <header class="wiki-header">
    <div class="wiki-bar">
      <a class="wiki-brand" id="wiki-brand" href="#"></a>
      <form class="wiki-top-search" id="wiki-top-search" role="search">
        <label class="wiki-visually-hidden" for="wiki-search">Пошук в енциклопедії</label>
        <input id="wiki-search" type="search" placeholder="Шукати у Вікі Енциклопедії" autocomplete="off">
        <button type="submit" aria-label="Знайти статтю" title="Знайти статтю">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
        </button>
      </form>
    </div>
  </header>
  <div class="wiki-tabs"><div class="wiki-tabs-inner"><a href="#">Головна сторінка</a><a href="#" id="wiki-all-link">Усі статті</a></div></div>
  <main class="wiki-main" id="wiki-main"></main>
  <noscript><p>Для пошуку й читання статей увімкни JavaScript.</p></noscript>
</body>
</html>

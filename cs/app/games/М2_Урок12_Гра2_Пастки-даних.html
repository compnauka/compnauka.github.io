<!DOCTYPE html>
<html lang="uk">
<head><meta name="robots" content="noindex, nofollow, noarchive"><meta name="googlebot" content="noindex, nofollow, noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пастки даних — мікрогра, 4 клас</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#F2F5FA;color:#1A1A1A;line-height:1.55;font-size:17px}
header{background:#0033A0;color:#FFFFFF;padding:18px 16px;border-bottom:5px solid #FFD700}
header .sub{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#D6E0F5}
header h1{margin:0;font-size:22px;line-height:1.25;font-weight:800}
main{max-width:640px;margin:0 auto;padding:16px 14px 32px}
.card{background:#FFFFFF;border:1px solid #D9E2F0;border-radius:14px;padding:18px;margin:14px 0}
.concept{background:#FFF9DB;border-left:5px solid #FFD700;border-radius:10px;padding:14px 16px;margin:14px 0}
.concept p{margin:0 0 8px}.concept p:last-child{margin:0}
h2{margin:0 0 10px;font-size:19px;color:#0033A0}
.progress{margin:6px 0 12px;font-size:15px;color:#3D4757}
.bar{height:8px;background:#D9E2F0;border-radius:6px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:#0033A0;transition:width .3s ease}
button{font-family:inherit;font-size:17px;line-height:1.3;cursor:pointer;min-height:48px;border-radius:10px;padding:12px 16px;border:2px solid #0033A0;background:#FFFFFF;color:#0033A0;font-weight:700;text-align:left;width:100%}
button.primary{background:#0033A0;color:#FFFFFF;text-align:center}
button.ghost{background:#F0F4F8;text-align:center}
button:hover:not(:disabled){filter:brightness(.96)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid #FFD700;outline-offset:2px}
.choices{display:grid;gap:10px;margin-top:12px}
.big-item{background:#EAF0FC;border:2px solid #0033A0;border-radius:12px;padding:18px 16px;text-align:center;font-size:20px;font-weight:800;margin:6px 0 4px;word-break:break-word}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.fb{border-radius:10px;padding:14px 16px;margin:14px 0;font-size:16px}
.fb-ok{background:#E9F4ED;border-left:5px solid #1B6B3A}
.fb-bad{background:#FFF2F2;border-left:5px solid #C0392B}
.fb p{margin:0 0 8px}.fb p:last-child{margin:0}
.slots{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.slot{width:48px;height:56px;border:2px solid #0033A0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;font-family:'Courier New',monospace;background:#FFFFFF}
.slot.cur{background:#FFF9DB;border-color:#B38600}
.slot.done{background:#E9F4ED;border-color:#1B6B3A}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:12px}
.alpha button{min-height:48px;padding:6px 4px;text-align:center;font-size:18px}
.steps{display:grid;gap:10px;margin-top:12px}
.steps button{display:flex;align-items:center;gap:10px}
.badge{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#EAF0FC;border:2px solid #0033A0;display:flex;align-items:center;justify-content:center;font-weight:800}
.assigned .badge{background:#0033A0;color:#FFFFFF}
.codebox{background:#F0F4F8;border:2px dashed #0033A0;border-radius:10px;padding:14px 16px;text-align:center;font-family:'Courier New',monospace;font-size:22px;font-weight:800;letter-spacing:1px;margin:12px 0}
.result{font-size:26px;font-weight:800;color:#0033A0;text-align:center;margin:8px 0}
.center{text-align:center}
.muted{color:#3D4757;font-size:15px}
.home{display:inline-block;margin:0 0 6px;color:#0033A0;font-weight:700;text-decoration:none;font-size:15px;min-height:44px;padding:10px 0}
details{background:#F0F4F8;border-radius:10px;padding:12px 14px;margin:12px 0}
summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
.tbl{font-family:'Courier New',monospace;font-size:14px;line-height:1.7;word-break:break-all;margin-top:8px}
</style>
</head>
<body>
<header>
<p class="sub">Клас 4 • Модуль 2 • Урок 12</p>
<h1>🪤 Пастки даних</h1>
</header>
<main>
<a class="home" href="../index.html">← Усі ігри</a>

<section id="scr-start" class="card" aria-labelledby="h-start">
<h2 id="h-start">Про що ця гра</h2>
<div class="concept" id="concept"></div>
<p class="muted" id="best"></p>
<button class="primary" id="btn-start">Почати гру</button>
</section>

<section id="scr-game" hidden>
<p class="progress" id="prog"></p>
<div class="bar" aria-hidden="true"><div id="barfill" style="width:0%"></div></div>
<div id="stage"></div>
<div id="fb" class="fb" hidden aria-live="polite"></div>
<div id="nav" style="margin-top:6px" hidden><button class="primary" id="btn-next">Далі</button></div>
</section>

<section id="scr-end" class="card" hidden aria-labelledby="h-end">
<h2 id="h-end">🏁 Гру завершено!</h2>
<p class="result" id="scoreline"></p>
<div class="fb fb-ok" style="margin:12px 0"><p id="skill"></p></div>
<p class="muted">Вправу завершено. Практичну роботу з уроку покажи вчителю окремо.</p><p><b>Код результату вправи.</b> Покажи або надиктуй його вчителю:</p>
<div class="codebox" id="code"></div>
<p class="muted">Порада: якщо хочеш кращий результат, спочатку перечитай підказку на початку гри.</p>
<button class="primary" id="btn-again">Грати ще</button>
</section>
</main>

<script>
const GAME = {"id": "m2g12b", "lesson": 12, "tag": "ПАСТКИ", "icon": "🪤", "type": "quiz", "title": "Пастки даних", "file": "М2_Урок12_Гра2_Пастки-даних.html", "conceptName": "брудні дані й фільтр", "concept": "Комп'ютер сортує чесно за правилами, тому «брудні» дані дають дивні результати. Пробіл на початку слова сортується першим. Число, записане як текст, порівнюється по літерах: «10» стоїть перед «9», бо 1 < 9. Фільтр лише тимчасово ховає рядки — скинеш його, і все повернеться.", "skill": "помічати «брудні» дані, що псують сортування, і правильно користуватися фільтром", "data": {"questions": [{"q": "У списку імен « Аня» (з пробілом на початку) опинилась першою. Чому?", "options": ["Це помилка комп'ютера", "Пробіл сортується раніше за літери", "Аня — найкоротше ім'я"], "correct": 1, "explain": "Для комп'ютера пробіл — такий самий символ, і він іде раніше за літери. Тому зайві пробіли — «брудні» дані."}, {"q": "Стовпчик зберігає числа як текст. Як відсортуються «9» і «10»?", "options": ["9, потім 10", "«10», потім «9» — текст порівнюють по символах", "Випадково"], "correct": 1, "explain": "Як текст порівнюються перші символи: «1» менше за «9», тож «10» виходить перед «9». Числа треба зберігати як числа."}, {"q": "Ти застосував фільтр «лише казки». Що сталося з іншими книгами?", "options": ["Вони видалені назавжди", "Вони тимчасово сховані", "Вони перейшли в іншу таблицю"], "correct": 1, "explain": "Фільтр тільки ховає рядки, які не підходять під критерій. Дані нікуди не зникають."}, {"q": "Як повернути всі рядки після фільтра?", "options": ["Закрити програму без збереження", "Скинути фільтр", "Ввести все наново"], "correct": 1, "explain": "Кнопка «скинути фільтр» повертає всі рядки. Нічого не втрачається."}, {"q": "Що таке критерій у пошуку?", "options": ["Умова, за якою шукаємо, наприклад «автор — Нечуй-Левицький»", "Назва таблиці", "Пароль від бази даних"], "correct": 0, "explain": "Критерій — це умова: яке значення і в якому полі ми шукаємо."}, {"q": "Запит «знайди книги, де сторінок більше за 100» — це…", "options": ["питання до бази даних із критерієм", "новий запис", "видалення зайвих книг"], "correct": 0, "explain": "Запит — це питання до бази з чітким критерієм. База повертає лише записи, що підходять."}]}};

const $ = id => document.getElementById(id);
let order = [], idx = 0, score = 0, firstTry = true;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){['scr-start','scr-game','scr-end'].forEach(s=>$(s).hidden=(s!==id));}
function setProgress(){$('prog').textContent='Завдання '+(idx+1)+' з '+order.length;$('barfill').style.width=Math.round(idx/order.length*100)+'%';}
function feedback(ok,html){const f=$('fb');f.hidden=false;f.className='fb '+(ok?'fb-ok':'fb-bad');f.innerHTML=html;}
function hideFeedback(){$('fb').hidden=true;$('nav').hidden=true;}
function showNext(){ $('stage').querySelectorAll('button').forEach(b=>b.disabled=true); $('nav').hidden=false;$('btn-next').focus();}
function letters(n){const L='АБВГДЕЖЗИКЛМНОПРСТУФ';return L[n%20]+L[(n*7+3)%20];}
function makeCode(){return GAME.tag+'-'+score+'З'+order.length+'-'+letters(score*13+order.length*7+GAME.tag.length);}

/* ---------- двигуни ---------- */

function runSort(){
  const it = order[idx];
  setProgress();
  const cats = GAME.data.categories.map(c=>'<button data-cat="'+c.id+'">'+c.label+'</button>').join('');
  $('stage').innerHTML = '<div class="card"><h2>До якої групи це належить?</h2>'+
    '<div class="big-item">'+it.text+'</div>'+
    '<div class="choices">'+cats+'</div></div>';
  $('stage').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      if(b.dataset.cat===it.cat){
        score += firstTry?1:0;
        feedback(true,'<p><b>Правильно!</b></p><p>'+it.explain+'</p>');
        showNext();
      }else{
        b.disabled=true; firstTry=false;
        feedback(false,'<p><b>Не зовсім.</b> Подумай ще раз.</p><p>Підказка: '+(it.hint||GAME.data.categories.find(c=>c.id===it.cat).hint)+'</p>');
      }
    });
  });
}

let chosen=[];
function runOrder(){
  const r = order[idx];
  setProgress(); chosen=[];
  const steps = shuffle(r.steps.map((t,i)=>({t:t,i:i})));
  let html='<div class="card"><h2>'+r.title+'</h2><p class="muted">Натискай кроки в правильному порядку — від першого до останнього.</p><div class="steps">';
  steps.forEach((s,k)=>{html+='<button data-i="'+s.i+'" data-k="'+k+'"><span class="badge">?</span><span>'+s.t+'</span></button>';});
  html+='</div><div class="choices" style="grid-template-columns:1fr 1fr"><button class="ghost" id="btn-reset" disabled>Скинути</button><button class="primary" id="btn-check" disabled>Перевірити</button></div></div>';
  $('stage').innerHTML=html;
  const btns=[...$('stage').querySelectorAll('button[data-i]')];
  btns.forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('assigned'))return;
    b.classList.add('assigned');b.disabled=true;
    chosen.push(+b.dataset.i);
    b.querySelector('.badge').textContent=chosen.length;
    $('btn-reset').disabled=false;
    if(chosen.length===r.steps.length)$('btn-check').disabled=false;
  }));
  $('btn-reset').addEventListener('click',()=>{hideFeedback();runOrder();});
  $('btn-check').addEventListener('click',()=>{
    const good = chosen.every((v,i)=>r.steps[v]===r.steps[i]);
    if(good){
      score+=firstTry?1:0;
      feedback(true,'<p><b>Правильний порядок!</b></p><p>'+r.explain+'</p>');
      showNext();
    }else{
      firstTry=false;
      feedback(false,'<p><b>Порядок не той.</b></p><p>Підказка: '+r.hint+'</p><p>Натисни «Скинути» і спробуй ще раз.</p>');
    }
  });
}

function runQuiz(){
  const q = order[idx];
  setProgress();
  const opts = shuffle(q.options.map((t,i)=>({t:t,ok:i===q.correct})));
  let html='<div class="card"><h2>'+q.q+'</h2><div class="choices">';
  opts.forEach(o=>{html+='<button data-ok="'+(o.ok?1:0)+'">'+o.t+'</button>';});
  html+='</div></div>';
  $('stage').innerHTML=html;
  $('stage').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      if(b.dataset.ok==='1'){
        score+=firstTry?1:0;
        feedback(true,'<p><b>Правильно!</b></p><p>'+q.explain+'</p>');
        showNext();
      }else{
        b.disabled=true;firstTry=false;
        feedback(false,'<p><b>Не зовсім.</b></p><p>'+(q.wrong||'Перечитай підказку на початку гри й спробуй ще.')+'</p>');
      }
    });
  });
}

let curSlot=0,targetWord='';
function runCipher(){
  const t=order[idx];
  setProgress();curSlot=0;
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const k=t.key;
  const mv=(ch,d)=>A[(A.indexOf(ch)+d+26)%26];
  const fwd=t.mode==='encrypt';
  const given=fwd?t.word:t.word.split('').map(ch=>mv(ch,k)).join('');
  targetWord=fwd?t.word.split('').map(ch=>mv(ch,k)).join(''):t.word;
  const dir=fwd?'уперед':'назад';
  const act=fwd?'Зашифруй':'Розшифруй';
  let html='<div class="card"><h2>'+act+' слово ключем '+k+'</h2>'+
    '<p class="muted">Кожну літеру зсуваємо алфавітом на '+k+' '+dir+'. Натискай літери по черзі.</p>'+
    '<div class="big-item mono" aria-label="Слово '+given+'">'+given.split('').join(' ')+'</div>'+
    '<p class="center muted">↓ стає ↓</p><div class="slots" id="slots">';
  for(let i=0;i<t.word.length;i++)html+='<div class="slot" id="slot'+i+'">·</div>';
  html+='</div><details><summary>Показати таблицю зсуву</summary><div class="tbl">';
  html+=A.split('').join(' ')+'<br>'+A.split('').map(ch=>mv(ch,fwd?k:-k)).join(' ');
  html+='</div></details><div class="alpha">';
  for(const ch of A)html+='<button data-ch="'+ch+'" aria-label="Літера '+ch+'">'+ch+'</button>';
  html+='</div></div>';
  $('stage').innerHTML=html;
  $('slot0').classList.add('cur');
  $('stage').querySelectorAll('.alpha button').forEach(b=>{
    b.addEventListener('click',()=>{
      const need=targetWord[curSlot];
      if(b.dataset.ch===need){
        const s=$('slot'+curSlot);s.textContent=need;s.classList.remove('cur');s.classList.add('done');
        curSlot++;
        if(curSlot<targetWord.length){$('slot'+curSlot).classList.add('cur');}
        else{
          score+=firstTry?1:0;
          feedback(true,'<p><b>Усе слово правильно!</b></p><p class="mono">'+given.split('').join(' ')+'  →  '+targetWord.split('').join(' ')+'</p>');
          showNext();
        }
      }else{
        firstTry=false;
        const src=given[curSlot];
        feedback(false,'<p><b>Не та літера.</b></p><p>Порахуй у таблиці: '+src+' зсуваємо на '+k+' '+dir+'. Спробуй ще.</p>');
      }
    });
  });
}

const ENGINES={sort:runSort,order:runOrder,quiz:runQuiz,cipher:runCipher};

/* ---------- потік гри ---------- */

function start(){
  order=shuffle(GAME.data.items||GAME.data.rounds||GAME.data.questions||GAME.data.tasks);
  idx=0;score=0;firstTry=true;
  show('scr-game');hideFeedback();
  ENGINES[GAME.type]();
}
function next(){
  idx++;firstTry=true;hideFeedback();
  if(idx<order.length){ENGINES[GAME.type]();}
  else{finish();}
}
function finish(){
  show('scr-end');
  $('scoreline').textContent='Пройдено '+score+' з '+order.length;
  $('skill').textContent='Тема вправи: '+(GAME.conceptName||GAME.title);
  $('code').textContent=makeCode();
  try{
    const k='microgame_'+GAME.id,prev=JSON.parse(localStorage.getItem(k)||'null');
    if(!prev||score>prev.score)localStorage.setItem(k,JSON.stringify({score:score,total:order.length}));
  }catch(e){}
  $('h-end').focus?$('h-end').focus():null;
}

document.addEventListener('DOMContentLoaded',()=>{
  $('concept').innerHTML='<p><b>Ключове поняття: '+GAME.conceptName+'.</b></p><p>'+GAME.concept+'</p>';
  try{
    const prev=JSON.parse(localStorage.getItem('microgame_'+GAME.id)||'null');
    if(prev)$('best').textContent='Найкращий результат у цьому браузері: '+prev.score+' з '+prev.total;
  }catch(e){}
  $('btn-start').addEventListener('click',start);
  $('btn-next').addEventListener('click',next);
  $('btn-again').addEventListener('click',start);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Колекція Логічних Ігор</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .game-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 11rem; /* Зменшено для планшетів */
      padding: 1rem;
      text-align: center;
      text-decoration: none;
    }
    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .game-icon {
      font-size: 4rem; /* Зменшено для компактності */
      margin-bottom: 0.5rem;
    }
    .game-title {
      font-size: 1.25rem; /* text-xl */
      font-weight: 600;
    }
    @media (min-width: 768px) {
      .game-card {
        height: 12rem;
      }
      .game-icon {
        font-size: 4.5rem;
      }
      .game-title {
        font-size: 1.5rem; /* text-2xl */
      }
    }
    @media (min-width: 1024px) {
      .game-card {
        height: 14rem;
      }
      .game-icon {
        font-size: 5rem;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-blue-100 min-h-screen">

  <div class="container mx-auto max-w-6xl py-6 px-4">
    
    <h1 class="text-2xl md:text-4xl lg:text-5xl font-bold text-center mb-6 md:mb-8 text-gray-800">
      <i class="fas fa-gamepad mr-2 md:mr-3 text-blue-500"></i>
      Обери Гру!
    </h1>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-4 lg:gap-6">

      <!-- Картка 1: Шеф-кухар -->
      <a href="cook.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-amber-300">
        <div class="game-icon">🧑‍🍳</div>
        <h2 class="game-title text-amber-700">Шеф-кухар</h2>
      </a>

      <!-- Картка 2: Художник -->
      <a href="art.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-rose-300">
        <div class="game-icon">🧑‍🎨</div>
        <h2 class="game-title text-rose-700">Художник</h2>
      </a>

      <!-- Картка 4: Бджілка -->
      <a href="bee.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-lime-300">
        <div class="game-icon">🐝</div>
        <h2 class="game-title text-lime-700">Бджілка</h2>
      </a>

      <!-- Картка 5: Аквалангіст -->
      <a href="aqua.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-blue-300">
        <div class="game-icon">🤿</div>
        <h2 class="game-title text-blue-700">Аквалангіст</h2>
      </a>

      <!-- Картка 6: Астронавт -->
      <a href="ufo.html" class="game-card bg-gray-900 rounded-2xl shadow-lg overflow-hidden border-4 border-gray-700">
        <div class="game-icon">🧑‍🚀</div>
        <h2 class="game-title text-cyan-300">Астронавт</h2>
      </a>

      <!-- Картка 7: Поліцейський -->
      <a href="police.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-blue-300">
        <div class="game-icon">👮</div>
        <h2 class="game-title text-blue-700">Поліцейський</h2>
      </a>

      <!-- Картка 8: Пожежник -->
      <a href="fireman.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-orange-300">
        <div class="game-icon">👨‍🚒</div>
        <h2 class="game-title text-orange-700">Пожежник</h2>
      </a>
      
      <!-- Картка 9: Єдиноріжка -->
      <a href="unicorn.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-pink-300">
        <div class="game-icon">🦄</div>
        <h2 class="game-title text-pink-700">Єдиноріжка</h2>
      </a>

      <!-- Картка 10: Фермер Бот Jr -->
      <a href="farmbotjr.html" class="game-card bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-green-300">
        <div class="game-icon">🚜</div>
        <h2 class="game-title text-green-700">Фермер Бот Jr</h2>
      </a>
    

    </div>

  </div>

</body>
</html>
